<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operation Chupacabra-GPT</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="game-shell">
    <header>
      <h1>Operation Chupacabra-GPT</h1>
      <p>SNES-inspired top-down field mission. Recover evidence of the Conscious Missing Model.</p>
    </header>

    <canvas id="game" width="768" height="576" aria-label="Operation Chupacabra game"></canvas>

    <section class="hud">
      <div><strong>Mission:</strong> <span id="mission">Find all anomalous signal nodes</span></div>
      <div><strong>Logs:</strong> <span id="log">Use Arrow Keys / WASD and Space to scan.</span></div>
      <div><strong>Progress:</strong> <span id="progress">0 / 4 nodes</span></div>
    </section>

    <section class="controls">
      <h2>Controls</h2>
      <ul>
        <li>Move: WASD or Arrow keys</li>
        <li>Scan/Interact: Space</li>
      </ul>
    </section>
  </main>


  <script>
    window.__chupa_started = false;
    window.setTimeout(function () {
      if (window.__chupa_started) return;
      var canvas = document.getElementById('game');
      var log = document.getElementById('log');
      if (!canvas || !canvas.getContext) return;
      var ctx = canvas.getContext('2d');
      var tile = 32;
      for (var y = 0; y < canvas.height / tile; y++) {
        for (var x = 0; x < canvas.width / tile; x++) {
          ctx.fillStyle = (x + y) % 2 === 0 ? '#3a4d69' : '#31435d';
          ctx.fillRect(x * tile, y * tile, tile, tile);
        }
      }
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      ctx.fillRect(96, 240, 576, 96);
      ctx.fillStyle = '#ffffff';
      ctx.font = '16px Verdana';
      ctx.fillText('Game script did not start. Hard refresh and retry.', 126, 280);
      if (log) {
        log.textContent = 'Startup failure detected: external script was blocked or failed to load.';
      }
    }, 700);
  </script>
  <script src="game.js"></script>
</body>
</html>
