<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Operation Chupacabra-GPT</title>
  <style>
    body { margin:0; background:#111; color:#dbe8ff; font-family: monospace; display:flex; flex-direction:column; align-items:center; }
    h1 { margin: 10px 0 4px; font-size: 18px; }
    canvas { image-rendering: pixelated; border: 4px solid #35445c; margin-top:6px; }
    #ui { width: 640px; margin-top: 8px; }
    #log { min-height: 48px; background:#1a1f2e; padding:8px; border:1px solid #35445c; }
    #help { margin-top: 6px; font-size: 12px; opacity: 0.9; }
  </style>
</head>
<body>
  <h1>Operation Chupacabra-GPT — Vertical Slice</h1>
  <canvas id="game" width="640" height="480"></canvas>
  <div id="ui">
    <div id="log">Welcome, Investigator. Talk to 3 NPCs, buy coffee, clear the lab, and reveal the first ghost message.</div>
    <div id="help">Move: Arrow Keys / WASD · Interact: E · Attack: Space · Buy coffee at vendor after talking to NPCs.</div>
  </div>
  <script src="game.js"></script>
</body>
</html>
